<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="Phone-friendly stock watchlist dashboard (Yahoo Finance data)."
    />
    <title>Stock Watchlist</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <h1>Stock Watchlist</h1>
          <p class="meta">
            Last updated (Pacific):
            <span class="value" id="last-updated">Loading…</span>
            <span class="loading-count" id="loading-count" hidden></span>
          </p>
          <p class="note">
            Price, change, sparkline &amp; news load live in the browser.
            Forward PE / consensus / target may show — on static hosting if
            Yahoo fundamentals are blocked.
          </p>
        </div>
        <button type="button" class="refresh" id="refresh-btn">Refresh</button>
      </div>
    </header>

    <main>
      <div class="grid" id="grid" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      Data via Yahoo Finance (unofficial). Not investment advice.
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
